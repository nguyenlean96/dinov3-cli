[project]
name = "dinov3-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4.0",
  "huggingface-hub>=1.14.0",
  "python-dotenv>=1.2.0",
  "transformers>=4.50.0",
  "torch>=2.4.0",
  "torchvision>=0.20.0",
  "matplotlib>=3.10.9",
  "requests>=2.34.1",
  "typer>=0.25.1",
  "rich>=15.0.0",
  "ruff>=0.13.0",
  "pydantic>=2.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.15.0",
  "mypy>=1.17.1",
  "pyinstaller>=6.11.0",

  # for mypy
  "lxml-stubs",
  "types-Pygments",
  "types-pexpect",
  "types-PyYAML",
  "types-ujson"
]
api = [
  "fastapi>=0.138.0",
  "uvicorn[standard]>=0.49.0",
  "mcp>=1.28.0"
]

[tool.setuptools.packages.find]
include = ["dinov3_cli*"]
exclude = ["tests*"]

[project.scripts]
dinov3-cli = "dinov3_cli.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
exclude = ["tests"]

# PyTorch CUDA support
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }